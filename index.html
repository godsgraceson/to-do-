<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>My To-Do List</h1>
      <p class="subtitle">Simple, fast and lightweight.</p>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Enter a task..." maxlength="100" required />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>
      <button id="clear-all" class="clear-btn" type="button">Clear all</button>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
